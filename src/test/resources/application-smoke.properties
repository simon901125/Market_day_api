# In-memory database used only by the smoke-test profile.
spring.datasource.url=jdbc:h2:mem:marketday_smoke;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Do not execute scheduled SQL Server jobs during smoke tests.
app.scheduling.enabled=false

# Prevent startup from creating a default administrator.
admin.email=
admin.password=
admin.name=Smoke Test Admin

# Non-production values required to build application beans.
google.client-id=smoke-test-client
jwt.secret=smoke-test-jwt-secret-that-is-long-enough-for-testing-only
jwt.expiration-ms=3600000

# The smoke test must not connect to an external SMTP server.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# The smoke test builds payment beans but never calls the payment gateway.
newebpay.merchant-id=smoke-test-merchant
newebpay.hash-key=smoke-test-hash-key
newebpay.hash-iv=smoke-test-hash-iv
newebpay.notify-url=http://localhost/smoke/newebpay/notify
newebpay.return-url=http://localhost/smoke/newebpay/return
frontend.url=http://localhost:4200

# Keep any test-created image files outside the project workspace.
app.image.storage=local
app.image.directory=${java.io.tmpdir}/marketday-smoke-images
app.image.public-base-url=
