# Dedicated SQL Server database for integration tests.
# Never point these variables to the development or production MarketDayDB.
spring.datasource.url=${TEST_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=MarketDayDB_Test;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Validate the existing SQL Server schema without creating or altering tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Integration tests must not start background jobs or create default accounts.
app.scheduling.enabled=false
admin.email=
admin.password=
admin.name=Integration Test Admin

# Non-production values required to create application beans.
google.client-id=integration-test-client
jwt.secret=integration-test-jwt-secret-that-is-long-enough-for-testing-only
jwt.expiration-ms=3600000

# Do not connect to external mail or payment services during integration tests.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
newebpay.merchant-id=integration-test-merchant
newebpay.hash-key=integration-test-hash-key
newebpay.hash-iv=integration-test-hash-iv
newebpay.notify-url=http://localhost/integration/newebpay/notify
newebpay.return-url=http://localhost/integration/newebpay/return
frontend.url=http://localhost:4200

# Keep integration-test image files outside the project workspace.
app.image.directory=${java.io.tmpdir}/marketday-integration-images
app.image.public-base-url=

# Keep the integration-test console focused on failures and test results.
debug=false
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
