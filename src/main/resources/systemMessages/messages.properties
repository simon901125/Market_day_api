workflow-status.DRAFT=主辦方建立活動草稿
workflow-status.PENDING_REVIEW=主辦方提交活動上架申請，通知管理員審核
workflow-status.REVISION_REQUIRED=審核中發現問題，通知主辦方補件
workflow-status.MAP_BUILDING=管理員審核通過，通知主辦方活動進入建置地圖流程
workflow-status.READY_TO_PUBLISH=管理員將活動地圖建置完成，並通知主辦方可以將活動公布
workflow-status.PUBLISHED=主辦方公布活動
workflow-status.FINAL_REVIEW=主辦方確認活動參與攤位完畢
workflow-status.UNPUBLISH_REQUESTED=主辦方提交活動下架申請
workflow-status.UNPUBLISHED=管理員同意活動下架申請
workflow-status.CANCELLED=主辦方取消活動
