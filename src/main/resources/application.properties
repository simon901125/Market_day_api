# for spring boot to sql server
spring.application.name=demo
spring.datasource.url=${DB_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=MarketDayDB;encrypt=true;trustServerCertificate=true}
# 可設定環境變數 DB_USERNAME，或修改 run-local.cmd 的資料庫帳號。
spring.datasource.username=${DB_USERNAME:sa}
# 可設定環境變數 DB_PASSWORD，或修改 run-local.cmd 的 SQL Server 密碼。
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# for google oauth
google.client-id=${GOOGLE_CLIENT_ID:}

# for jwt
jwt.secret=${JWT_SECRET:please-change-this-local-dev-secret-to-a-long-random-value}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# for default system admin
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
admin.name=${ADMIN_NAME:Admin}

# for email verification
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.port=${SERVER_PORT:8081}

# for swagger ui
springdoc.swagger-ui.path=/swagger-ui/marketDay/index.html
app.swagger.public-base-url=${SWAGGER_PUBLIC_BASE_URL:}
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true

# for newebpay
newebpay.merchant-id=${NEWEBPAY_MERCHANT_ID:}
newebpay.hash-key=${NEWEBPAY_HASH_KEY:}
newebpay.hash-iv=${NEWEBPAY_HASH_IV:}
newebpay.version=${NEWEBPAY_VERSION:2.3}
newebpay.gateway=${NEWEBPAY_GATEWAY:https://ccore.newebpay.com/MPG/mpg_gateway}
newebpay.query-url=${NEWEBPAY_QUERY_URL:https://ccore.newebpay.com/API/QueryTradeInfo}
newebpay.close-url=${NEWEBPAY_CLOSE_URL:https://ccore.newebpay.com/API/CreditCard/Close}
newebpay.notify-url=${NEWEBPAY_NOTIFY_URL:https://disengage-chaste-musky.ngrok-free.dev/api/newebpay/notify}
newebpay.return-url=${NEWEBPAY_RETURN_URL:https://disengage-chaste-musky.ngrok-free.dev/api/newebpay/return}

# for scheduled jobs
app.scheduling.enabled=${SCHEDULING_ENABLED:true}

# for image storage
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.image.storage=${IMAGE_STORAGE:gcs}
app.image.directory=${IMAGE_DIRECTORY:images}
app.image.public-base-url=${IMAGE_PUBLIC_BASE_URL:}
app.image.gcs.bucket=${GCS_BUCKET: market_day_images}
app.image.gcs.public-base-url=${GCS_PUBLIC_BASE_URL:https://storage.googleapis.com}
